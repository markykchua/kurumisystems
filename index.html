<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kurumi Systems – Under Construction</title>
    <meta name="description"
        content="Kurumi Systems builds tools that empower knowledge workers to see, shape, and control how AI remembers and thinks. Our new site is under construction." />
    <meta name="author" content="Kurumi Systems Inc." />
    <meta name="theme-color" content="#ffffff" />
    <link rel="canonical" href="https://kurumisystems.com/" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png" />
    <link rel="icon" type="image/png" sizes="128x128" href="kurumi_logo_128X128.png" />
    <link rel="apple-touch-icon" href="kurumi_logo_128X128.png" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://kurumisystems.com/" />
    <meta property="og:title" content="Kurumi Systems – Under Construction" />
    <meta property="og:description" content="Our new site is under construction. Check back soon." />
    <meta property="og:site_name" content="Kurumi Systems" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Kurumi Systems – Under Construction" />
    <meta name="twitter:description" content="Our new site is under construction. Check back soon." />

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <style>
        /* ── Design Tokens ─────────────────────────────────── */
        :root {
            --bg: #fbfbfa;
            --surface: #f3f4f6;
            --border: #e5e7eb;
            --text: #1e293b;
            --text-muted: #64748b;
            --accent: #0ea5e9;
            --radius: 12px;
        }

        /* ── Reset & Base ──────────────────────────────────── */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        html,
        body {
            height: 100%
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            text-align: center;
            padding: clamp(1.5rem, 5vw, 3rem);
        }

        img {
            display: block;
            max-width: 100%
        }

        a {
            color: inherit;
            text-decoration: none
        }

        /* ── Layout ────────────────────────────────────────── */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            padding: 2rem 0;
        }

        .logo {
            width: clamp(80px, 18vw, 128px);
            height: auto;
            margin: 0 auto;
        }

        .brand {
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: -0.01em;
        }

        .construction {
            font-size: clamp(2rem, 7vw, 3.5rem);
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1.15;
        }

        .construction .dots {
            color: var(--accent);
        }

        .subtitle {
            color: var(--text-muted);
            font-size: clamp(0.95rem, 2vw, 1.1rem);
            max-width: 34rem;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.45rem 1rem;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: var(--surface);
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .badge .pulse {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent);
            animation: pulse 1.8s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1) }
            50% { opacity: 0.4; transform: scale(0.8) }
        }

        @media (prefers-reduced-motion: reduce) {
            .badge .pulse {
                animation: none
            }
        }

        /* ── Footer ────────────────────────────────────────── */
        footer {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        footer a {
            color: var(--accent);
        }
    </style>
</head>

<body>
    <main>
        <img class="logo" src="kurumi_logo_128X128.png" alt="Kurumi Systems Logo">
        <div class="brand">Kurumi Systems</div>
        <h1 class="construction">under construction<span class="dots">...</span></h1>
        <p class="subtitle">
            We're building something new. Our site will be back shortly.
        </p>
        <div class="badge"><span class="pulse"></span> Check back soon</div>
    </main>

    <footer>
        <p>&copy; 2025 – 2026 Kurumi Systems Inc. All rights reserved.</p>
        <p>
            <a href="https://kurumisystems.com">kurumisystems.com</a> &middot;
            <a href="mailto:info@kurumisystems.com">Contact Us</a>
        </p>
    </footer>
</body>

</html>
